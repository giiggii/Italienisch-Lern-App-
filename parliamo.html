<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parliamo!">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}</style>

<body>
<title>Parliamo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: light;
  --bg: #fbf6ec; --card: #ffffff; --ink: #2b2420; --muted: #6b5f57; --line: #e6dccb;
  --primary: #b8452c; --primary-ink: #ffffff; --primary-dark: #8f3320;
  --green: #2f6b3c; --green-bg: #e3f1e2; --amber: #8a5a00; --amber-bg: #fdefd0;
  --accent-bg: #f3ead6; --sel: #fbe4dc; --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 18px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
h1 { font-size: 1.6rem; margin: .2rem 0 .6rem; line-height: 1.2; }
h2 { font-size: 1.2rem; margin: 1rem 0 .4rem; line-height: 1.25; }
p { margin: .4rem 0; }
small { color: var(--muted); font-size: .85rem; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #1d5fa8; outline-offset: 2px; }

.page { max-width: 34rem; margin: 0 auto; padding-block: 1rem 6.5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.center { text-align: center; } .left { text-align: left; }
.muted { color: var(--muted); } .lead { font-size: 1.15rem; }
.label { font-size: .85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: .9rem 0 .3rem; }
.row { display: flex; align-items: center; gap: .6rem; } .centerrow { justify-content: center; }
.grow { flex: 1; min-width: 0; } .stack { display: grid; gap: .6rem; margin: .8rem 0; }
.it { font-family: Georgia, "Times New Roman", serif; font-size: 1.2rem; } .xl { font-size: 1.9rem; margin: .2rem 0; }
.logo { font-size: 4rem; margin-top: 1rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; margin: .9rem 0; }
.card h2:first-child, .card .label:first-child { margin-top: 0; }
.card.accent { background: var(--accent-bg); } .card.warn { background: var(--amber-bg); border-color: #e9cf95; }
.card.tap { cursor: pointer; }
details summary { cursor: pointer; font-weight: 600; padding: .5rem 0; min-height: 2.6rem; }

.btn { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; min-height: 3.2rem; padding: .7rem 1rem; margin: .6rem 0; border-radius: 16px; border: 2px solid transparent; font-weight: 700; font-size: 1.05rem; text-align: center; }
.btn.primary { background: var(--primary); color: var(--primary-ink); box-shadow: 0 4px 0 var(--primary-dark); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
.btn.ghost { background: var(--card); border-color: var(--line); }
.btn.danger { background: transparent; color: #a12a1c; border-color: #e2b7b0; }
.btn.huge { min-height: 4rem; font-size: 1.2rem; } .btn.big { min-height: 4.2rem; font-size: 1.3rem; justify-content: flex-start; }
.btn.slim { width: auto; min-height: 2.8rem; margin: 0; padding: .4rem .9rem; }
.btn:disabled { opacity: .45; box-shadow: none; }
.row .btn { margin: 0; }
.filebtn { position: relative; cursor: pointer; }
.filebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.back { background: none; border: 0; color: var(--primary); font-weight: 700; padding: .6rem .2rem; min-height: 2.8rem; }

label { display: block; font-weight: 600; margin: .8rem 0 .3rem; }
input[type=text], input[type=password], input[type=url], select, textarea { width: 100%; min-height: 3.2rem; padding: .7rem .9rem; border: 2px solid var(--line); border-radius: 14px; background: #fff; font-size: 1.1rem; }
textarea { min-height: 8rem; }

.top { display: flex; align-items: center; gap: .8rem; margin-bottom: .6rem; }
.top h1 { margin: 0; } .hello { margin: 0; color: var(--muted); } .top > div { flex: 1; }
.who { background: var(--card); border: 2px solid var(--line); border-radius: 50%; width: 3.4rem; height: 3.4rem; font-size: 1.7rem; }
.av { font-size: 1.6rem; }
.streak { background: var(--amber-bg); border-radius: 999px; padding: .5rem .9rem; font-weight: 800; font-size: 1.1rem; }
.goal { display: flex; align-items: center; gap: 1rem; } .goal h2 { margin: 0; }
.ring { --p: 0; width: 4.6rem; height: 4.6rem; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(closest-side, var(--card) 72%, transparent 73%), conic-gradient(var(--green) calc(var(--p) * 1%), var(--line) 0); }

.avatars { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .6rem; }
.avatar { width: 3.2rem; height: 3.2rem; font-size: 1.6rem; border-radius: 50%; border: 3px solid var(--line); background: #fff; }
.avatar.on { border-color: var(--primary); background: var(--sel); }

.unit { display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem; margin: .5rem 0; min-height: 4.4rem; }
.unit b, .unit small { display: block; } .uemoji { font-size: 2rem; } .chev { font-size: 1.6rem; color: var(--muted); }
.bar { display: block; height: .45rem; background: var(--line); border-radius: 9px; margin-top: .35rem; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }

.words { display: grid; gap: .4rem; }
.word { display: flex; align-items: center; gap: .5rem; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding-right: .7rem; }
.wbtn { display: flex; align-items: center; gap: .7rem; background: none; border: 0; text-align: left; padding: .6rem .7rem; min-height: 3.4rem; }
.wbtn b, .wbtn small { display: block; } .wemoji { font-size: 1.5rem; width: 2rem; text-align: center; }
.tag { font-style: normal; font-size: .7rem; background: var(--amber-bg); color: var(--amber); border-radius: 6px; padding: .1rem .35rem; font-weight: 700; }
.dots { display: flex; gap: .2rem; } .dots i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--green); }
.del { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 0; background: #f6dcd6; color: #a12a1c; font-weight: 800; }
.ex { padding: .4rem 0; border-top: 1px solid var(--line); margin-top: .4rem; }
.conj { width: 100%; border-collapse: collapse; } .conj td { padding: .25rem .2rem; border-top: 1px solid var(--line); } .conj td:first-child { color: var(--muted); width: 40%; }

.say { flex: none; width: 3rem; height: 3rem; border-radius: 50%; border: 0; background: var(--accent-bg); font-size: 1.3rem; }
.say.sm { width: 2.6rem; height: 2.6rem; font-size: 1.05rem; }
.say.giant { width: 6.5rem; height: 6.5rem; font-size: 3rem; background: var(--primary); box-shadow: 0 5px 0 var(--primary-dark); }

.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: .8rem 0; }
.thumb { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb button { position: absolute; top: .2rem; right: .2rem; width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; font-weight: 800; }

.games { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-top: .8rem; }
.game { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem .6rem; min-height: 8rem; display: flex; flex-direction: column; align-items: center; gap: .2rem; text-align: center; }
.game span { font-size: 2.4rem; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: .8rem 0; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .7rem .3rem; text-align: center; }
.tile b { display: block; font-size: 1.25rem; } .tile small { display: block; line-height: 1.2; }
.chart { display: flex; align-items: flex-end; gap: .4rem; height: 9rem; }
.col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: .15rem; }
.col i { width: 100%; min-height: 3px; background: #d9b9a6; border-radius: 6px 6px 0 0; } .col i.full { background: var(--green); }
.col .val { font-size: .75rem; color: var(--muted); }
.lvl { display: flex; gap: .3rem; } .lvl i { flex: 1; height: .8rem; border-radius: 6px; background: var(--line); } .lvl i.on { background: var(--primary); }
.badges { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.badge { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .7rem; text-align: center; opacity: .5; filter: grayscale(1); }
.badge.on { opacity: 1; filter: none; background: var(--accent-bg); }
.badge span { font-size: 2rem; display: block; } .badge b, .badge small { display: block; line-height: 1.25; }

.seg { display: flex; gap: .3rem; flex-wrap: wrap; }
.seg button { flex: 1; min-height: 3rem; padding: .4rem .5rem; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-weight: 600; }
.seg button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.status { font-weight: 700; color: var(--amber); } .status.ok { color: var(--green); }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.tabbar button { flex: 1; background: none; border: 0; padding: .5rem 0 .45rem; font-size: .72rem; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; min-height: 3.6rem; }
.tabbar span { font-size: 1.45rem; line-height: 1.2; filter: grayscale(.6); opacity: .75; }
.tabbar .on { color: var(--primary); } .tabbar .on span { filter: none; opacity: 1; }

/* Lerneinheit */
.session { padding-bottom: 7rem; }
.shead { display: flex; align-items: center; gap: .7rem; margin-bottom: 1rem; }
.close { width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 0; background: var(--accent-bg); font-size: 1.1rem; flex: none; }
.pbar { flex: 1; height: .9rem; background: var(--line); border-radius: 9px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--green); border-radius: 9px; transition: width .3s; }
.task { font-weight: 700; color: var(--muted); margin: 0 0 .6rem; }
.prompt { display: flex; align-items: center; gap: .7rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; min-height: 5rem; }
.prompt.col { flex-direction: column; text-align: center; } .prompt h2 { margin: 0; flex: 1; font-size: 1.3rem; } .prompt h2.xl { font-size: 1.8rem; }
.pemoji { font-size: 2.6rem; }
.opts { display: grid; gap: .6rem; }
.opt { width: 100%; min-height: 3.6rem; padding: .6rem .9rem; border-radius: 16px; border: 2px solid var(--line); background: var(--card); font-size: 1.1rem; font-weight: 600; text-align: left; box-shadow: 0 3px 0 var(--line); color: var(--ink); }
.opt.sel { border-color: var(--primary); background: var(--sel); box-shadow: 0 3px 0 var(--primary); }
.opt.good { border-color: var(--green); background: var(--green-bg); box-shadow: none; opacity: 1; }
.opt.bad { border-color: #c98a1a; background: var(--amber-bg); box-shadow: none; }
.opt:disabled { opacity: .85; }
.gap { display: inline-block; min-width: 4.5rem; border-bottom: 3px solid var(--primary); margin: 0 .25rem; text-align: center; color: var(--primary); font-weight: 700; }
.gap.filled { color: var(--green); border-color: var(--green); }
.answer { text-align: center; font-size: 1.35rem !important; font-family: Georgia, serif; }
.accents { display: flex; gap: .4rem; margin-top: .6rem; }
.accents button { flex: 1; min-height: 3rem; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 1.2rem; }
.line { min-height: 4.4rem; border-bottom: 2px solid var(--line); border-top: 2px solid var(--line); padding: .6rem 0; margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.bank { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
.tok { min-height: 3rem; padding: .4rem .9rem; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 1.15rem; font-family: Georgia, serif; box-shadow: 0 3px 0 var(--line); color: var(--ink); }
.tok.used { opacity: .25; box-shadow: none; }
.matchgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; } .matchgrid > div { display: grid; gap: .6rem; align-content: start; }
.matchgrid .opt { font-size: 1rem; padding: .5rem .6rem; min-height: 3.8rem; }
.flash { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem 1rem; text-align: center; }
.flash.left { text-align: left; } .femoji { font-size: 4.5rem; line-height: 1.1; } .de { font-size: 1.25rem; font-weight: 600; }
.example { background: var(--accent-bg); border-radius: 14px; padding: .7rem; margin-top: 1rem; text-align: left; }
.story { font-size: 1.25rem; line-height: 1.6; }
.mic { width: 5.5rem; height: 5.5rem; border-radius: 50%; border: 0; background: var(--primary); font-size: 2.4rem; margin-top: .8rem; box-shadow: 0 5px 0 var(--primary-dark); }
.mic.on { background: var(--green); box-shadow: 0 0 0 .6rem var(--green-bg); }
.sfoot { position: fixed; left: 0; right: 0; bottom: 0; padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
.sfoot .btn { max-width: 32rem; margin: 0 auto; }
.feedback { position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; z-index: 6; box-shadow: 0 -6px 24px rgba(0,0,0,.12); max-height: 70vh; overflow: auto; }
.feedback > * { max-width: 32rem; margin-left: auto; margin-right: auto; }
.feedback h2 { margin-top: 0; }
.feedback.ok { background: var(--green-bg); } .feedback.ok h2 { color: var(--green); }
.feedback.no { background: var(--amber-bg); } .feedback.no h2 { color: var(--amber); }
.feedback .row { margin-top: .7rem; }
.aiexp { background: rgba(255,255,255,.7); border-radius: 12px; padding: .6rem; }

.memory { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: 1rem 0; }
.mcard { aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--primary-dark); background: var(--primary); color: #fff; font-size: 1.6rem; font-weight: 700; padding: .2rem; overflow-wrap: anywhere; }
.mcard.open { background: var(--card); color: var(--ink); border-color: var(--line); font-size: .95rem; }
.mcard.open.mit { font-family: Georgia, serif; font-size: 1.05rem; background: var(--accent-bg); }
.mcard.found { background: var(--green-bg); border-color: var(--green); }

.summary .confetti { font-size: 1.6rem; letter-spacing: .3rem; overflow: hidden; white-space: nowrap; animation: drift 6s linear infinite alternate; }
@keyframes drift { from { transform: translateX(-8%); } to { transform: translateX(8%); } }

.toast { position: fixed; left: 1rem; right: 1rem; top: calc(1rem + env(safe-area-inset-top)); max-width: 30rem; margin: 0 auto; background: #2b2420; color: #fff; padding: .9rem 1rem; border-radius: 14px; z-index: 20; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
#busy, #confirm { position: fixed; inset: 0; background: rgba(43,36,32,.6); display: grid; place-items: center; z-index: 30; padding: 1.5rem; }
.busy-box { background: var(--card); border-radius: 22px; padding: 1.6rem; text-align: center; max-width: 24rem; }
.busy-box p:first-of-type { font-weight: 700; font-size: 1.15rem; }
.spinner { width: 3.4rem; height: 3.4rem; margin: 0 auto 1rem; border-radius: 50%; border: .45rem solid var(--line); border-top-color: var(--primary); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner, .summary .confetti { animation-duration: 0s; animation-iteration-count: 1; } .pbar i { transition: none; } }

.steps { padding-left: 1.3rem; margin: .4rem 0 .8rem; } .steps li { margin: .35rem 0; }
#promptbox { font-size: .8rem; min-height: 6rem; }
</style>
<div id="app"></div>
<script>
(() => {
'use strict';

// ---- data.js ----
// Fest eingebaute Grundlagen (A1). Damit funktioniert die App auch ohne KI und ohne eigene Fotos.

const V = (it, de, emoji, ex_it, ex_de) => ({ it, de, emoji, ex_it, ex_de });

const STARTER = [
  {

    pool: [],

  {

    pool: [],
  },
  {
    id: 'b-famiglia', builtin: true, emoji: '👨‍👩‍👧', title: 'Familie und Freunde',

// Speicherung auf dem Gerät (localStorage). Es werden keine Daten an einen eigenen Server gesendet.

const KEY = 'parla.v1';

const defaults = () => ({
  v: 1, profiles: [], current: null, units: [],
  settings: { apiKey: '', model: 'claude-opus-5-5', proxyUrl: '' },
});

const newProfile = (name, avatar) => ({
  id: 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e4),
  name, avatar, xp: 0, streak: 0, best: 0, lastDay: null, days: {},
  level: 1.6, auto: true, items: {}, done: {}, badges: [],
  sessions: 0, answers: 0, correct: 0, perfect: 0, memory: 0,
  prefs: { font: 1, rate: 0.85, goal: 50, len: 10, sound: true, speakEx: true },
});

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw), d = defaults();
      return { ...d, ...s, settings: { ...d.settings, ...(s.settings || {}) } };
    }
  } catch (e) { console.warn('Laden fehlgeschlagen', e); }
  return defaults();
}

const state = load();

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { console.warn('Speichern fehlgeschlagen', e); }
}

function replaceState(obj) {
  const d = defaults();
  Object.keys(state).forEach(k => delete state[k]);
  Object.assign(state, d, obj, { settings: { ...d.settings, ...(obj.settings || {}) } });
  save();
}

const profile = () => state.profiles.find(p => p.id === state.current) || null;
const allUnits = () => [...state.units, ...STARTER];
const unitById = id => allUnits().find(u => u.id === id);

function dayKey(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

const norm = s => String(s || '').toLowerCase().normalize('NFC')
  .replace(/[.,!?;:¡¿"«»()]/g, ' ').replace(/[’`´]/g, '\'').replace(/\s+/g, ' ').trim();
const stripAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const wordId = it => 'w:' + norm(it);

// Wiederholung in wachsenden Abständen (Leitner-System): Fach 0 bis 5.
const INTERVAL = [0, 1, 2, 4, 9, 21];
function grade(p, id, ok) {
  const it = p.items[id] || (p.items[id] = { box: 0, due: 0, ok: 0, ko: 0 });
  if (ok) { it.ok++; it.box = Math.min(5, it.box + 1); }
  else { it.ko++; it.box = Math.max(0, Math.min(it.box - 1, 1)); }
  it.due = Date.now() + INTERVAL[it.box] * 864e5 - 6 * 36e5;
}

function stats(p) {
  let mastered = 0, learning = 0, due = 0;
  const now = Date.now();
  for (const [id, it] of Object.entries(p.items)) {
    if (!id.startsWith('w:')) continue;
    if (it.box >= 3) mastered++; else learning++;
    if (it.due <= now) due++;
  }
  return { mastered, learning, due, ownUnits: state.units.length };
}

function touchDay(p, xp) {
  const t = dayKey();
  if (p.lastDay !== t) {
    const y = dayKey(new Date(Date.now() - 864e5));
    p.streak = p.lastDay === y ? p.streak + 1 : 1;
    p.lastDay = t;
    p.best = Math.max(p.best, p.streak);
  }
  p.days[t] = (p.days[t] || 0) + xp;
  p.xp += xp;
}

function liveStreak(p) {
  if (!p.lastDay) return 0;
  const y = dayKey(new Date(Date.now() - 864e5));
  return (p.lastDay === dayKey() || p.lastDay === y) ? p.streak : 0;
}

// ---- exercises.js ----
// Erzeugt Lerneinheiten: wählt Wörter nach Wiederholungsplan und passt die Aufgabenart an das Niveau an.

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

const ARTICLE = /^(il|lo|la|i|gli|le|un|uno|una)\s+|^(l'|un')\s*/i;
const bare = it => it.replace(ARTICLE, '').trim();

function collectWords(unitIds) {
  const seen = new Set(), out = [];
  for (const u of allUnits()) {
    if (unitIds && !unitIds.includes(u.id)) continue;
    for (const v of u.vocab) {
      const id = wordId(v.it);
      if (seen.has(id)) continue;
      seen.add(id); out.push({ ...v, id, unit: u.id });
    }
  }
  return out;
}

function distract(word, all, field, n) {
  const out = [], used = new Set([norm(word[field])]);
  const same = shuffle(all.filter(w => w.unit === word.unit)), other = shuffle(all.filter(w => w.unit !== word.unit));
  for (const w of [...same, ...other]) {
    const k = norm(w[field]);
    if (used.has(k) || w.id === word.id) continue;
    used.add(k); out.push(w[field]);
    if (out.length === n) break;
  }
  return out;
}

function mcFrom(q, correct, wrong, extra = {}) {
  const opts = shuffle([correct, ...wrong]);
  return { k: 'mc', q, opts, ans: opts.indexOf(correct), ...extra };
}

const tokens = s => s.trim().split(/\s+/);
const orderable = s => { const n = tokens(s || '').length; return n >= 3 && n <= 9; };

function clozeFrom(w, all, typed) {
  const b = bare(w.it);
  if (!w.ex_it || b.length < 2) return null;
  const idx = w.ex_it.toLowerCase().indexOf(b.toLowerCase());
  if (idx < 0) return null;
  const found = w.ex_it.slice(idx, idx + b.length);
  const sent = w.ex_it.slice(0, idx) + '___' + w.ex_it.slice(idx + b.length);
  const cap = found[0] !== found[0].toLowerCase();
  const fix = s => { s = bare(s); return cap ? s[0].toUpperCase() + s.slice(1) : s; };
  const wrong = distract(w, all, 'it', 2).map(fix).filter(x => norm(x) !== norm(found));
  if (!typed && wrong.length < 2) return null;
  return { k: 'cloze', sent, de: w.ex_de, opts: typed ? null : shuffle([found, ...wrong]), ans: found, items: [w.id], say: w.ex_it };
}

function orderFrom(sent, de, items, level, all) {
  const t = tokens(sent);
  let extra = [];
  if (level >= 3.2 && all) {
    const have = new Set(t.map(norm));
    extra = shuffle(all.map(w => bare(w.it)).filter(x => !x.includes(' ') && !have.has(norm(x)))).slice(0, level >= 4.2 ? 2 : 1);
  }
  return { k: 'order', de, tokens: t, bank: shuffle([...t, ...extra]), items, say: sent };
}

function wordExercise(w, eff, all, prefs, forced) {
  const n = eff < 2 ? 2 : 3;
  const itde = () => mcFrom(w.it, w.de, distract(w, all, 'de', n), { items: [w.id], say: w.it, sub: 'Was bedeutet das?', big: true, emoji: '' });
  const deit = () => mcFrom(w.de, w.it, distract(w, all, 'it', n), { items: [w.id], sub: 'Wie heißt das auf Italienisch?', big: true, emoji: w.emoji, sayAfter: w.it });
  const listen = () => { const o = mcFrom('', w.de, distract(w, all, 'de', n), { items: [w.id] }); return { ...o, k: 'listen', audio: w.it, reveal: w.it }; };
  const type = () => ({ k: 'type', de: w.de, ans: w.it, emoji: w.emoji, items: [w.id], hint: eff < 4.2 ? bare(w.it)[0] : '' });
  const speak = () => (eff >= 3.8 && w.ex_it
    ? { k: 'speak', it: w.ex_it, de: w.ex_de, items: [w.id] } : { k: 'speak', it: w.it, de: w.de, items: [w.id] });
  const order = () => (orderable(w.ex_it) ? orderFrom(w.ex_it, w.ex_de, [w.id], eff, all) : null);

  let kinds;
  if (forced) kinds = [forced];
  else if (eff < 2) kinds = ['itde', 'listen', 'itde'];
  else if (eff < 3) kinds = ['deit', 'listen', 'cloze', 'itde'];
  else if (eff < 4) kinds = ['cloze', 'order', 'type', 'deit', 'listen'];
  else kinds = ['type', 'order', 'clozeT', 'type', prefs.speakEx ? 'speak' : 'order'];
  const make = { itde, deit, listen, type, speak, order, cloze: () => clozeFrom(w, all, false), clozeT: () => clozeFrom(w, all, true) };
  return make[pick(kinds)]() || (eff < 2.5 ? itde() : deit());
}

function verbPool(units, level) {
  const own = units.flatMap(u => u.verbs || []);
  const base = VERBS.slice(0, Math.min(VERBS.length, 2 + Math.round(level * 2.5)));
  const seen = new Set();
  return [...own, ...base].filter(v => !seen.has(v.inf) && seen.add(v.inf));
}

function verbExercise(v, level) {
  const i = Math.floor(Math.random() * 6), form = v.forms[i];
  const typed = level >= 3.6;
  const wrong = shuffle([...new Set(v.forms)].filter(f => f !== form)).slice(0, level < 2 ? 2 : 3);
  return {
    k: 'cloze', sent: `${PERSONS[i]} ___`, de: `${v.inf} = ${v.de}`, title: 'Welche Verbform passt?',
    opts: typed ? null : shuffle([form, ...wrong]), ans: form, items: [`v:${v.inf}:${i}`],
    say: `${PERSONS[i].split(' / ')[0]} ${form}`, explain: `${v.inf}: ${v.forms.join(', ')}`,
  };
}

function fromPool(x, level) {
  if (x.type === 'mc') {
    const correct = x.opts[x.ans], opts = shuffle(x.opts);
    return { k: 'mc', q: x.q, opts, ans: opts.indexOf(correct), explain: x.explain, xid: x.id, items: [] };
  }
  if (x.type === 'cloze') return { k: 'cloze', sent: x.sent, de: x.de, opts: level >= 4.4 ? null : shuffle(x.opts), ans: x.answer, explain: x.explain, xid: x.id, items: [], say: x.sent.replace('___', x.answer) };
  if (x.type === 'order') return { ...orderFrom(x.sent, x.de, [], level, null), xid: x.id };
  return { k: 'type', de: x.de, ans: x.it, items: [], xid: x.id, hint: '' };
}

function storyExercises(story) {
  return [
    { k: 'read', title: story.title, it: story.it, de: story.de },
    ...story.questions.map(q => { const c = q.opts[q.ans], opts = shuffle(q.opts); return { k: 'mc', q: q.q, opts, ans: opts.indexOf(c), items: [], sub: 'Frage zum Text' }; }),
  ];
}

// mode: mix | review | listen | order | speak | verbs
function buildSession(p, { unitIds = null, mode = 'mix', len } = {}) {
  len = len || p.prefs.len;
  const L = p.level, now = Date.now();
  const units = allUnits().filter(u => !unitIds || unitIds.includes(u.id));
  const words = collectWords(unitIds), all = collectWords(null);
  const st = w => p.items[w.id];

  if (mode === 'verbs') {
    const pool = verbPool(units, L);
    return Array.from({ length: len }, () => verbExercise(pick(pool), L));
  }

  const due = words.filter(w => st(w) && st(w).due <= now).sort((a, b) => st(a).box - st(b).box || st(a).due - st(b).due);
  const fresh = words.filter(w => !st(w));
  const later = words.filter(w => st(w) && st(w).due > now).sort((a, b) => st(a).due - st(b).due);

  const forced = { listen: 'listen', speak: 'speak', order: 'order' }[mode];
  let chosen;
  if (mode === 'review') chosen = [...due, ...later].slice(0, len);
  else if (forced) {
    const ok = w => mode !== 'order' || orderable(w.ex_it);
    chosen = [...due, ...shuffle(later), ...fresh].filter(ok).slice(0, len);
  } else {
    const target = Math.ceil(len * 0.7);
    let nNew = L < 2 ? 2 : L < 3.5 ? 3 : 4;
    if (due.length < target - nNew) nNew = Math.min(5, target - due.length);
    const f = fresh.slice(0, nNew);
    chosen = [...due.slice(0, target - f.length), ...f];
    if (chosen.length < target) chosen.push(...later.slice(0, target - chosen.length));
  }

  const cards = [], body = [];
  for (const w of chosen) {
    const s = st(w), box = s ? s.box : 0;
    const eff = L + (box - 1.5) * 0.35 + (Math.random() - 0.5) * 0.6;
    if (!s && !forced) { cards.push({ k: 'card', w }); body.push(wordExercise(w, 1, all, p.prefs, 'itde')); }
    else body.push(wordExercise(w, eff, all, p.prefs, forced));
  }

  if (mode === 'mix') {
    // Aufgaben aus dem Unterricht (von der KI erzeugt), passend zum Niveau und möglichst noch nicht gelöst.
    const pool = units.flatMap(u => u.pool || []).filter(x => Math.abs(x.level - L) <= 1.4)
      .map(x => ({ x, r: (p.done[x.id] || 0) * 10 + Math.abs(x.level - L) + Math.random() }))
      .sort((a, b) => a.r - b.r).slice(0, Math.max(2, Math.floor(len * (unitIds ? 0.5 : 0.35)))).map(o => fromPool(o.x, L));
    body.push(...pool);
    if (L >= 1.8 && !unitIds || units.some(u => (u.verbs || []).length)) {
      const vp = verbPool(units, L);
      body.push(verbExercise(pick(vp), L));
    }
    const m = chosen.filter(w => w.de.length < 26 && w.it.length < 26);
    if (m.length >= 4) {
      const pairs = shuffle(m).slice(0, L < 3 ? 4 : 5);
      body.push({ k: 'match', pairs: pairs.map(w => [w.it, w.de]), items: pairs.map(w => w.id) });
    }
  }
  const rest = shuffle(body).slice(0, len);
  return [...cards.filter(c => rest.some(e => e.items && e.items.includes(c.w.id))), ...rest];
}

function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

// Nachsichtige Prüfung getippter Antworten: Akzente, Artikel und kleine Tippfehler führen nicht zum Fehler.
function checkTyped(given, answer) {
  const g = norm(given);
  if (!g) return { ok: false };
  let best = { ok: false };
  for (const alt of answer.split(/\s+\/\s+/)) {
    const a = norm(alt);
    if (g === a) return { ok: true };
    const g2 = stripAcc(g), a2 = stripAcc(a);
    if (g2 === a2) best = { ok: true, note: 'Richtig! Achte noch auf den Akzent.' };
    else if (!best.ok && norm(bare(g)) === norm(bare(a))) best = { ok: true, note: 'Richtig! Denke noch an den Artikel.' };
    else if (!best.ok && a2.length >= 5 && lev(g2, a2) <= (a2.length >= 12 ? 2 : 1)) best = { ok: true, note: 'Fast perfekt, nur ein kleiner Tippfehler.' };
  }
  return best;
}

function similar(heard, target) {
  const a = stripAcc(norm(heard)), b = stripAcc(norm(target));
  if (!a || !b) return 0;
  return 1 - lev(a, b) / Math.max(a.length, b.length);
}

// Anbindung an die Claude-API: Fotos der Unterrichtsunterlagen lesen und neue Übungen erzeugen.
// Der Schlüssel liegt nur auf dem Gerät (Einstellungen) oder alternativ hinter einem eigenen Proxy.

const API_URL = 'https://api.anthropic.com/v1/messages';

// Weg 1 (kostenlos): Die Seite läuft als Artifact auf claude.ai und fragt Claude über das Konto der Person, die sie öffnet.
// Weg 2: eigener API-Schlüssel oder Proxy. Weg 3: Anleitung kopieren und Antwort aus der Claude-App einfügen.
let sampleFn = null, sampleImages = false;
const aiMode = () => (sampleFn ? 'claude' : (state.settings.apiKey || state.settings.proxyUrl) ? 'key' : 'none');
const aiReady = () => aiMode() !== 'none';
const canSendPhotos = () => (sampleFn ? sampleImages : aiReady());
async function initAI(onChange) {
  try {
    const fn = await window.claude?.use?.('sample');
    if (!fn) return;
    sampleFn = fn;
    const lim = await fn.limits().catch(() => null);
    sampleImages = !!lim?.images;
    onChange();
  } catch (e) { /* kein Claude-Zugang in dieser Ansicht */ }
}

const SAMPLE_ERRORS = {
  not_granted: 'Die Nutzung von Claude wurde für diese Seite nicht erlaubt. Bitte die Seite neu laden und die Frage mit „Erlauben“ beantworten.',
  sampling_disabled: 'Claude steht für dieses Konto hier nicht zur Verfügung.',
  rate_limited: 'Das Nutzungslimit des Claude-Kontos ist im Moment erreicht. Bitte später noch einmal versuchen.',
  session_expired: 'Bitte bei Claude neu anmelden und die Seite noch einmal öffnen.',
  image_rejected: 'Eines der Fotos konnte nicht verarbeitet werden. Bitte ein anderes Foto versuchen.',
  images_unavailable: 'In dieser Ansicht können keine Fotos an Claude gesendet werden.',
  refused: 'Claude konnte diese Anfrage nicht bearbeiten. Bitte ein anderes Foto versuchen.',
  prompt_too_large: 'Die Anfrage war zu groß. Bitte weniger auf einmal senden.',
};

function toBlob(dataUrl) {
  const [head, b64] = dataUrl.split(','), bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: (head.match(/data:(.*?);/) || [])[1] || 'image/jpeg' });
}

async function ask(text, { images = [], quick = false, effort = 'low', maxTokens = 16000 } = {}) {
  if (sampleFn) {
    try {
      const opts = { cache: false, modelTier: quick ? 'quick' : 'default' };
      if (images.length) opts.images = images.map(toBlob);
      const r = await sampleFn(PERSONA + '\n\n' + text, opts);
      if (r.truncated && !r.text.trim().endsWith('}')) throw { code: 'truncated' };
      return r.text;
    } catch (e) {
      throw new Error(SAMPLE_ERRORS[e?.code] || (e?.code === 'truncated' ? 'Die Antwort war zu lang. Bitte weniger Fotos auf einmal senden.' : 'Claude ist gerade nicht erreichbar. Bitte später noch einmal versuchen.'));
    }
  }
  const content = images.map(d => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: d.split(',')[1] } }));
  content.push({ type: 'text', text });
  return callClaude({ system: PERSONA, content, effort, maxTokens });
}

async function callClaude({ system, content, effort = 'low', maxTokens = 16000 }) {
  const { apiKey, proxyUrl, model } = state.settings;
  if (!apiKey && !proxyUrl) throw new Error('Es ist noch kein KI-Zugang eingerichtet. Bitte in den Einstellungen nachsehen.');
  const body = {
    model, max_tokens: maxTokens, system,
    output_config: { effort },
    messages: [{ role: 'user', content }],
  };
  const headers = { 'content-type': 'application/json' };
  if (!proxyUrl) {
    headers['x-api-key'] = apiKey;
    headers['anthropic-version'] = '2026-10-21';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
    // Bei einer (hier sehr unwahrscheinlichen) Ablehnung durch Sicherheitsfilter antwortet ein Ersatzmodell.
    if (!model.includes('haiku')) {
      headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
      body.fallbacks = 'default';
    }
  }
  let res, lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      res = await fetch(proxyUrl || API_URL, { method: 'POST', headers, body: JSON.stringify(body) });
    } catch (e) {
      lastErr = new Error('Keine Verbindung zum Internet. Bitte WLAN oder mobile Daten prüfen und noch einmal versuchen.');
      await wait(1500 * (attempt + 1)); continue;
    }
    if (res.ok) break;
    let msg = '';
    try { msg = (await res.json())?.error?.message || ''; } catch (e) { /* kein JSON */ }
    if (res.status === 401 || res.status === 403) throw new Error('Der KI-Schlüssel wurde nicht akzeptiert. Bitte in den Einstellungen prüfen.');
    if (res.status === 400 || res.status === 404 || res.status === 413) throw new Error('Die Anfrage wurde abgelehnt. ' + (res.status === 413 ? 'Die Fotos sind zu groß, bitte weniger Fotos auf einmal senden.' : msg));
    lastErr = new Error(res.status === 429
      ? 'Im Moment sind zu viele Anfragen unterwegs. Bitte in einer Minute noch einmal versuchen.'
      : 'Der KI-Dienst ist gerade nicht erreichbar. Bitte später noch einmal versuchen.');
    res = null;
    await wait(2500 * (attempt + 1));
  }
  if (!res) throw lastErr;
  const data = await res.json();
  if (data.stop_reason === 'refusal') throw new Error('Die KI konnte diese Anfrage nicht bearbeiten. Bitte ein anderes Foto versuchen.');
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  if (data.stop_reason === 'max_tokens' && !text.trim().endsWith('}')) throw new Error('Die Antwort der KI war zu lang. Bitte weniger Fotos auf einmal senden.');
  return text;
}

const wait = ms => new Promise(r => setTimeout(r, ms));

function parseJSON(text) {
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Die Antwort der KI war nicht lesbar. Bitte noch einmal versuchen.');
  try { return JSON.parse(text.slice(a, b + 1)); }
  catch (e) { throw new Error('Die Antwort der KI war nicht lesbar. Bitte noch einmal versuchen.'); }
}

// ---------- Prüfung und Aufbereitung der KI-Antworten ----------
const str = (x, max = 400) => (typeof x === 'string' ? x.trim().slice(0, max) : '');

function cleanExercises(list) {
  const out = [];
  for (const e of Array.isArray(list) ? list : []) {
    if (!e || typeof e !== 'object') continue;
    const level = Math.max(1, Math.min(5, Math.round(Number(e.level) || 2)));
    const id = 'x' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    if (e.type === 'mc') {
      const opts = (e.options || []).map(o => str(o, 120)).filter(Boolean);
      const ans = Number(e.answer_index);
      if (str(e.question_de) && opts.length >= 2 && Number.isInteger(ans) && ans >= 0 && ans < opts.length && new Set(opts).size === opts.length)
        out.push({ id, level, type: 'mc', q: str(e.question_de), opts, ans, explain: str(e.explain_de) });
    } else if (e.type === 'cloze') {
      const opts = (e.options || []).map(o => str(o, 60)).filter(Boolean);
      const answer = str(e.answer, 60), sent = str(e.sentence_it);
      if (sent.includes('___') && answer && opts.includes(answer) && new Set(opts).size === opts.length)
        out.push({ id, level, type: 'cloze', sent, de: str(e.translation_de), opts, answer, explain: str(e.explain_de) });
    } else if (e.type === 'order') {
      const sent = str(e.sentence_it, 160), n = sent.split(/\s+/).length;
      if (n >= 3 && n <= 9 && str(e.translation_de)) out.push({ id, level, type: 'order', sent, de: str(e.translation_de) });
    } else if (e.type === 'translate') {
      if (str(e.de) && str(e.it)) out.push({ id, level, type: 'translate', de: str(e.de, 160), it: str(e.it, 160) });
    }
  }
  return out;
}

function cleanVocab(list) {
  const seen = new Set(), out = [];
  for (const v of Array.isArray(list) ? list : []) {
    const it = str(v?.it, 80), de = str(v?.de, 120);
    if (!it || !de || seen.has(it.toLowerCase())) continue;
    seen.add(it.toLowerCase());
    out.push({ it, de, emoji: str(v.emoji, 8), ex_it: str(v.example_it, 200), ex_de: str(v.example_de, 200), isNew: !!v.new });
  }
  return out;
}

function cleanStory(s) {
  if (!s || !str(s.text_it, 2000)) return null;
  const questions = (Array.isArray(s.questions) ? s.questions : []).map(q => {
    const opts = (q?.options || []).map(o => str(o, 120)).filter(Boolean), ans = Number(q?.answer_index);
    return str(q?.question_de) && opts.length >= 2 && Number.isInteger(ans) && ans >= 0 && ans < opts.length
      ? { q: str(q.question_de), opts, ans } : null;
  }).filter(Boolean);
  return { title: str(s.title, 100) || 'Geschichte', it: str(s.text_it, 2000), de: str(s.text_de, 2000), questions };
}

function toUnit(raw) {
  const story = cleanStory(raw.story), culture = cleanStory(raw.culture);
  return {
    id: 'u' + Date.now().toString(36),
    created: Date.now(),
    emoji: str(raw.emoji, 8) || '📘',
    title: str(raw.title, 80) || 'Neue Lektion',
    summary: str(raw.summary_de, 600),
    vocab: cleanVocab(raw.vocab),
    grammar: (Array.isArray(raw.grammar) ? raw.grammar : []).map(g => ({
      title: str(g?.title, 100), text: str(g?.explanation_de, 900),
      examples: (Array.isArray(g?.examples) ? g.examples : []).map(x => ({ it: str(x?.it, 200), de: str(x?.de, 200) })).filter(x => x.it),
    })).filter(g => g.title && g.text),
    verbs: (Array.isArray(raw.conjugations) ? raw.conjugations : []).map(c => ({
      inf: str(c?.infinitive, 40), de: str(c?.de, 60), forms: (c?.forms || []).map(f => str(f, 40)),
    })).filter(c => c.inf && c.forms.length === 6 && c.forms.every(Boolean)),
    stories: story ? [story] : [],
    culture: culture ? { title: culture.title, it: culture.it, de: culture.de } : null,
    pool: cleanExercises(raw.exercises),
  };
}

function mergeMore(unit, raw) {
  const have = new Set(unit.vocab.map(v => v.it.toLowerCase()));
  const nv = cleanVocab(raw.new_vocab).filter(v => !have.has(v.it.toLowerCase())).map(v => ({ ...v, isNew: true }));
  unit.vocab.push(...nv);
  const story = cleanStory(raw.story), culture = cleanStory(raw.culture);
  if (story) (unit.stories || (unit.stories = [])).unshift(story);
  if (culture) unit.culture = { title: culture.title, it: culture.it, de: culture.de };
  const ex = cleanExercises(raw.exercises);
  unit.pool.push(...ex);
  return { words: nv.length, exercises: ex.length, story: !!story };
}

}

  try {

    (ok ? [660, 880] : [330]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t + i * 0.11);

      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.11 + 0.25);
      o.connect(g).connect(actx.destination); o.start(t + i * 0.11); o.stop(t + i * 0.11 + 0.3);

}

  el.innerHTML = `<div class="busy-box"><div class="spinner"></div><p id="busy-msg">${esc(messages[0])}</p><p class="muted">Das kann bis zu einer Minute dauern. Bitte die App geöffnet lassen.</p></div>`;
  document.body.appendChild(el);
  let i = 0;
  busyTimer = setInterval(() => { i = (i + 1) % messages.length; const m = document.getElementById('busy-msg'); if (m) m.textContent = messages[i]; }, 3500);
}
function unbusy() { clearInterval(busyTimer); document.getElementById('busy')?.remove(); }

// Eigene Rückfrage, weil confirm() nicht in jeder Umgebung angezeigt wird.
function confirmBox(msg, yes = 'Ja') {
  return new Promise(res => {
    const el = document.createElement('div');
    el.id = 'confirm';
    el.innerHTML = `<div class="busy-box" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><button class="btn primary" data-y>${esc(yes)}</button><button class="btn ghost" data-n>Abbrechen</button></div>`;
    document.body.appendChild(el);
    el.addEventListener('click', e => { const y = e.target.closest('[data-y]'), n = e.target.closest('[data-n]'); if (!y && !n) return; el.remove(); res(!!y); });
  });
}

      </div>
      ${r.levelMsg ? `<p class="card">${r.levelMsg}</p>` : ''}
      ${r.badges.map(b => `<div class="card accent"><h2>${b.emoji} Neues Abzeichen: ${b.name}</h2><p>${b.text}</p></div>`).join('')}
      ${r.wrong.length ? `<section class="card left"><h2>Zum Merken</h2>${r.wrong.map(w => `<div class="row ex"><p class="it grow">${esc(w)}</p>${sayBtn(w, 'sm')}</div>`).join('')}</section>` : ''}
      <button class="btn primary huge" data-act="again">Noch eine Runde</button>
      <button class="btn ghost" data-act="go" data-to="home">Fertig für jetzt</button>

};

// ---------- Lerneinheit ----------
function startSession(title, list, opts = {}) {
  if (!list.length) { toast('Dafür gibt es noch nicht genug Wörter. Lernen Sie zuerst ein paar Wörter unter „Heute“.'); return; }
  S = { title, list, i: 0, right: 0, total: 0, xp: 0, wrong: [], opts, startLevel: profile().level };
  resetAnswer();
  go('session');
}

function resetAnswer() {
  Object.assign(S, { phase: 'ask', sel: null, text: '', placed: [], fb: null, heard: '', listening: false, showDe: false, m: { left: null, done: [], miss: false, bad: null } });
  const ex = S.list[S.i];
  if (ex?.k === 'match') S.m.right = shuffle(ex.pairs.map((_, i) => i));
  S.spoken = false;
}

function autoSpeak() {
  const ex = S?.list[S.i];
  if (!ex || S.phase !== 'ask' || S.spoken) return;
  S.spoken = true;
  const t = ex.k === 'card' ? ex.w.it : ex.k === 'listen' ? ex.audio : ex.k === 'mc' && ex.big && ex.say ? ex.say : ex.k === 'speak' ? ex.it : '';
  if (t) setTimeout(() => speak(t), 250);
}

function sessionView(p) {
  const ex = S.list[S.i], done = Math.round(100 * S.i / S.list.length);
  const opts = (list) => `<div class="opts">${list.map((o, i) => {
    let c = S.sel === i ? 'sel' : '';
    if (S.phase === 'fb') c = i === ex.ans || o === ex.ans ? 'good' : S.sel === i ? 'bad' : '';
    return `<button class="opt ${c}" data-act="sel" data-i="${i}" ${S.phase === 'fb' ? 'disabled' : ''}>${esc(o)}</button>`;
  }).join('')}</div>`;
  const input = (ph) => `<input id="answer" class="answer" type="text" lang="it" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph}" value="${esc(S.text)}" data-in="text" ${S.phase === 'fb' ? 'disabled' : ''}>
    <div class="accents">${['à', 'è', 'é', 'ì', 'ò', 'ù'].map(a => `<button data-act="accent" data-c="${a}" ${S.phase === 'fb' ? 'disabled' : ''}>${a}</button>`).join('')}</div>`;
  let body = '', canCheck = false, footer = null;

  if (ex.k === 'card') {
    const w = ex.w;
    body = `<p class="task">Neues Wort</p><div class="flash"><div class="femoji">${esc(w.emoji || '🇮🇹')}</div><div class="row centerrow"><h2 class="it xl">${esc(w.it)}</h2>${sayBtn(w.it)}</div><p class="de">${esc(w.de)}</p>
      ${w.ex_it ? `<div class="example"><div class="row"><p class="it grow">${esc(w.ex_it)}</p>${sayBtn(w.ex_it, 'sm')}</div><p class="muted">${esc(w.ex_de)}</p></div>` : ''}</div>`;
    footer = `<button class="btn primary huge" data-act="next">Verstanden, weiter</button>`;
  } else if (ex.k === 'read') {
    body = `<p class="task">Lesen und zuhören</p><div class="flash left"><h2>${esc(ex.title)}</h2><p class="it story">${esc(ex.it)}</p>
      <div class="row"><button class="btn ghost" data-act="say" data-text="${esc(ex.it)}">🔊 Vorlesen</button><button class="btn ghost" data-act="saySlow" data-text="${esc(ex.it)}">🐢 Langsam</button></div>
      ${S.showDe ? `<p class="muted">${esc(ex.de)}</p>` : `<button class="btn ghost" data-act="showDe">Übersetzung zeigen</button>`}</div>`;
    footer = `<button class="btn primary huge" data-act="next">Weiter${S.list[S.i + 1] ? ' zu den Fragen' : ''}</button>`;
  } else if (ex.k === 'mc') {
    body = `<p class="task">${esc(ex.sub || 'Wählen Sie die richtige Antwort')}</p>
      <div class="prompt">${ex.emoji ? `<span class="pemoji">${esc(ex.emoji)}</span>` : ''}<h2 class="${ex.big ? 'it xl' : ''}">${esc(ex.q)}</h2>${ex.say ? sayBtn(ex.say) : ''}</div>${opts(ex.opts)}`;
    canCheck = S.sel !== null;
  } else if (ex.k === 'listen') {
    body = `<p class="task">Was hören Sie?</p><div class="prompt col"><button class="say giant" data-act="say" data-text="${esc(ex.audio)}" aria-label="Noch einmal anhören">🔊</button><button class="btn ghost slim" data-act="saySlow" data-text="${esc(ex.audio)}">🐢 Langsam anhören</button>${S.phase === 'fb' ? `<h2 class="it">${esc(ex.reveal)}</h2>` : ''}</div>${opts(ex.opts)}`;
    canCheck = S.sel !== null;
  } else if (ex.k === 'cloze') {
    const fill = S.phase === 'fb' ? ex.ans : ex.opts ? (S.sel !== null ? ex.opts[S.sel] : '') : S.text;
    const [a, b] = ex.sent.split('___');
    body = `<p class="task">${esc(ex.title || 'Was passt in die Lücke?')}</p><div class="prompt col"><h2 class="it">${esc(a)}<span class="gap ${S.phase === 'fb' ? 'filled' : ''}">${esc(fill) || '&nbsp;'}</span>${esc(b || '')}</h2>${ex.de ? `<p class="muted">${esc(ex.de)}</p>` : ''}</div>${ex.opts ? opts(ex.opts) : input('Fehlendes Wort')}`;
    canCheck = ex.opts ? S.sel !== null : S.text.trim() !== '';
  } else if (ex.k === 'order') {
    const used = new Set(S.placed);
    body = `<p class="task">Bilden Sie den Satz auf Italienisch</p><div class="prompt"><h2>${esc(ex.de)}</h2></div>
      <div class="line" aria-label="Ihr Satz">${S.placed.map((bi, pos) => `<button class="tok" data-act="unplace" data-pos="${pos}" ${S.phase === 'fb' ? 'disabled' : ''}>${esc(ex.bank[bi])}</button>`).join('') || '<span class="muted">Tippen Sie unten auf die Wörter</span>'}</div>
      <div class="bank">${ex.bank.map((t, bi) => `<button class="tok ${used.has(bi) ? 'used' : ''}" data-act="place" data-i="${bi}" ${used.has(bi) || S.phase === 'fb' ? 'disabled' : ''}>${esc(t)}</button>`).join('')}</div>`;
    canCheck = S.placed.length > 0;
  } else if (ex.k === 'type') {
    body = `<p class="task">Schreiben Sie auf Italienisch</p><div class="prompt">${ex.emoji ? `<span class="pemoji">${esc(ex.emoji)}</span>` : ''}<h2>${esc(ex.de)}</h2></div>${input(ex.hint ? `Beginnt mit „${esc(ex.hint)}“` : 'Ihre Antwort')}`;
    canCheck = S.text.trim() !== '';
  } else if (ex.k === 'match') {
    const cell = (side, idx, text) => {
      const done = S.m.done.includes(idx), sel = side === 'l' && S.m.left === idx, bad = S.m.bad && S.m.bad[side] === idx;
      return `<button class="opt ${done ? 'good' : ''} ${sel ? 'sel' : ''} ${bad ? 'bad' : ''}" data-act="match" data-side="${side}" data-i="${idx}" ${done ? 'disabled' : ''}>${esc(text)}</button>`;
    };
    body = `<p class="task">Was gehört zusammen? Erst links, dann rechts antippen.</p><div class="matchgrid"><div>${ex.pairs.map((pr, i) => cell('l', i, pr[0])).join('')}</div><div>${S.m.right.map(i => cell('r', i, ex.pairs[i][1])).join('')}</div></div>`;
    footer = S.phase === 'fb' ? null : '';
  } else if (ex.k === 'speak') {
    body = `<p class="task">Sprechen Sie laut nach</p><div class="prompt col"><div class="row centerrow"><h2 class="it">${esc(ex.it)}</h2>${sayBtn(ex.it)}</div><p class="muted">${esc(ex.de)}</p>
      ${SR ? `<button class="mic ${S.listening ? 'on' : ''}" data-act="mic" aria-label="Aufnahme starten">🎤</button><p class="muted">${S.listening ? 'Ich höre zu …' : S.heard ? 'Verstanden: „' + esc(S.heard) + '“' : 'Auf das Mikrofon tippen und sprechen'}</p>` : '<p class="muted">Hören Sie zu und sprechen Sie den Satz zwei- bis dreimal laut nach.</p>'}</div>`;
    footer = S.phase === 'fb' ? null : `<button class="btn primary huge" data-act="spoke">Ich habe es laut gesprochen</button>`;
  }

  if (footer === null) {
    footer = S.phase === 'fb' ? '' : `<button class="btn primary huge" data-act="check" ${canCheck ? '' : 'disabled'}>Prüfen</button>`;
  }
  const fb = S.fb;
  const panel = S.phase === 'fb' && fb ? `<div class="feedback ${fb.ok ? 'ok' : 'no'}" role="status" aria-live="polite">
      <h2>${fb.ok ? '✓ ' + pick(PRAISE) : pick(COMFORT)}</h2>
      ${fb.ok ? '' : `<p>Richtig ist: <b class="it">${esc(fb.correct)}</b></p>`}
      ${fb.note ? `<p>${esc(fb.note)}</p>` : ''}${fb.ok && fb.correct && fb.showCorrect ? `<p class="it">${esc(fb.correct)}</p>` : ''}
      ${fb.explain ? `<p>${esc(fb.explain)}</p>` : ''}
      ${fb.ai ? `<p class="aiexp">💡 ${esc(fb.ai)}</p>` : ''}
      <div class="row">${fb.say ? sayBtn(fb.say) : ''}${!fb.ok && aiReady() && !fb.ai ? `<button class="btn ghost slim" data-act="why">💡 Warum?</button>` : ''}<button class="btn primary grow" data-act="next">Weiter</button></div>
    </div>` : '';

  return `<main class="page session">
    <header class="shead"><button class="close" data-act="quit" aria-label="Lerneinheit beenden">✕</button><div class="pbar" role="progressbar" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="100"><i style="width:${done}%"></i></div><span class="muted">${S.i + 1}/${S.list.length}</span></header>
    <section class="exercise">${body}</section>
    <footer class="sfoot">${footer}</footer>${panel}
  </main>`;
}

function taskText(ex) {
  if (ex.k === 'mc') return ex.q; if (ex.k === 'listen') return 'Hörverstehen: ' + ex.audio;
  if (ex.k === 'cloze') return ex.sent + (ex.de ? ' (' + ex.de + ')' : ''); if (ex.k === 'order' || ex.k === 'type') return 'Übersetze: ' + ex.de;
  return ex.it || '';
}

function settle(ok, { correct = '', given = '', note = '', showCorrect = false } = {}) {
  const p = profile(), ex = S.list[S.i];
  S.phase = 'fb';
  S.fb = { ok, correct, given, note, showCorrect, explain: ex.explain || '', say: ex.say || ex.sayAfter || ex.reveal || (ex.k === 'type' ? ex.ans : ''), task: taskText(ex) };
  if (!ex.retry) { S.total++; if (ok) S.right++; }
  p.answers++; if (ok) p.correct++;
  S.xp += ok ? (ex.retry ? 5 : 10) : 2;
  (ex.items || []).forEach(id => grade(p, id, ok));
  if (ex.xid) p.done[ex.xid] = (p.done[ex.xid] || 0) + 1;
  if (p.auto) p.level = Math.max(1, Math.min(5, p.level + (ok ? 0.05 : -0.12)));
  if (!ok) {
    if (correct && !S.wrong.includes(correct)) S.wrong.push(correct);
    if (!ex.retry) S.list.push({ ...ex, retry: true });
  }
  ding(ok); save(); render();
  const say = S.fb.say;
  if (say && ex.k !== 'listen') setTimeout(() => { if (S && S.list[S.i] === ex) speak(say); }, 350);
}

function check() {
  const ex = S.list[S.i];
  if (ex.k === 'mc' || ex.k === 'listen') settle(S.sel === ex.ans, { correct: ex.opts[ex.ans], given: ex.opts[S.sel] });
  else if (ex.k === 'cloze') {
    const full = ex.sent.replace('___', ex.ans);
    if (ex.opts) settle(ex.opts[S.sel] === ex.ans, { correct: full, given: ex.opts[S.sel] });
    else { const r = checkTyped(S.text, ex.ans); settle(r.ok, { correct: full, given: S.text, note: r.note, showCorrect: !!r.note }); }
  } else if (ex.k === 'order') {
    const given = S.placed.map(i => ex.bank[i]).join(' '), correct = ex.tokens.join(' ');
    settle(given === correct, { correct, given });
  } else if (ex.k === 'type') { const r = checkTyped(S.text, ex.ans); settle(r.ok, { correct: ex.ans, given: S.text, note: r.note, showCorrect: !!r.note }); }
}

function next() {
  window.speechSynthesis?.cancel?.();
  S.i++;
  if (S.i >= S.list.length) return finish();
  resetAnswer(); render(); window.scrollTo(0, 0);
}

function awardBadges(p) {
  const s = stats(p), fresh = BADGES.filter(b => !p.badges.includes(b.id) && b.test(p, s));
  fresh.forEach(b => p.badges.push(b.id));
  return fresh;
}

function finish() {
  const p = profile(), acc = S.total ? S.right / S.total : 1;
  const xp = S.xp + 10;
  p.sessions++;
  if (S.total >= 4 && S.right === S.total) p.perfect++;
  if (p.auto && S.total >= 4) p.level = Math.max(1, Math.min(5, p.level + (acc >= 0.9 ? 0.15 : acc < 0.6 ? -0.2 : 0)));
  touchDay(p, xp);
  const a = Math.round(S.startLevel), b = Math.round(p.level);
  const levelMsg = b > a ? `📈 Sie werden besser! Die Aufgaben werden jetzt etwas anspruchsvoller (Stufe ${b}: ${LEVELS[b - 1].name}).`
    : b < a ? `🌿 Wir gehen einen Schritt zurück und festigen die Grundlagen (Stufe ${b}: ${LEVELS[b - 1].name}). Das ist völlig in Ordnung.` : '';
  lastSummary = { xp, right: S.right, total: S.total, wrong: S.wrong.slice(0, 6), badges: awardBadges(p), levelMsg, opts: S.opts };
  save(); S = null; go('summary');
}

function launch(mode, unitId) {
  const p = profile();
  const titles = { mix: 'Lernen', review: 'Wiederholen', listen: 'Hör-Training', order: 'Satzbau', speak: 'Aussprache', verbs: 'Verb-Trainer' };
  startSession(titles[mode], buildSession(p, { mode, unitIds: unitId ? [unitId] : null }), { mode, unitId });
}

// ---------- Fotos ----------
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1568, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Dieses Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

async function addPhotos(files) {
  for (const f of files) {
    if (photos.length >= 6) { toast('Bitte höchstens 6 Fotos auf einmal.'); break; }
    try { photos.push(await shrink(f)); } catch (e) { toast(e.message); }
  }
  render();
}

async function analyse() {
  const note = document.getElementById('note')?.value || '';
  busy(['Ich schaue mir die Fotos an …', 'Ich lese die Handschrift …', 'Ich sammle die neuen Wörter …', 'Ich denke mir passende Übungen aus …', 'Ich schreibe eine kleine Geschichte …', 'Gleich fertig …']);

    const unit = toUnit(await analysePhotos(photos, note, profile().level));

    state.units.unshift(unit); photos = [];

    toast('Die neue Lektion ist fertig. Buono studio!');

// ---------- Memory ----------
function newMemory() {
  const p = profile();
  const known = collectWords(null).filter(w => p.items[w.id] && w.it.length < 22 && w.de.length < 22);
  const pool = known.length >= 6 ? known : collectWords(null).filter(w => w.it.length < 22 && w.de.length < 22);
  const words = shuffle(pool).slice(0, 6);
  M = { moves: 0, open: [], found: new Set(), lock: false, cards: shuffle(words.flatMap((w, i) => [{ pair: i, text: w.it, lang: 'mit' }, { pair: i, text: w.de, lang: 'mde' }])) };
  go('memory');
}

function flip(i) {
  const c = M.cards[i];
  if (M.lock || M.open.includes(i) || M.found.has(c.pair)) return;
  M.open.push(i);
  if (c.lang === 'mit') speak(c.text);
  if (M.open.length === 2) {
    M.moves++;
    const [a, b] = M.open.map(x => M.cards[x]);
    if (a.pair === b.pair) {
      M.found.add(a.pair); M.open = []; ding(true);
      if (M.found.size === M.cards.length / 2) { const p = profile(); p.memory++; touchDay(p, 20); awardBadges(p); save(); }
    } else { M.lock = true; setTimeout(() => { M.open = []; M.lock = false; if (view.name === 'memory') render(); }, 1400); }
  }
  render();
}

      }
    } catch (e) { toast(e.message.includes('KI') ? 'Die eingefügte Antwort war nicht lesbar. Bitte die Antwort von Claude vollständig kopieren.' : e.message, 6000); }
  },
  resetProfile: async () => {
    if (!await confirmBox('Wirklich alle Punkte und den Lernstand dieser Person löschen?', 'Zurücksetzen')) return;
    const p = profile(), n = newProfile(p.name, p.avatar);
    Object.assign(p, n, { id: p.id }); save(); go('home');
  },
  // Lerneinheit
  quit: async () => { if (await confirmBox('Lerneinheit beenden? Die bisherigen Antworten bleiben gespeichert.', 'Beenden')) { window.speechSynthesis?.cancel?.(); S = null; go('home'); } },
  sel: el => { S.sel = +el.dataset.i; render(); },
  check, next,
  showDe: () => { S.showDe = true; render(); },
  accent: el => { const inp = document.getElementById('answer'); S.text = (inp.value || '') + el.dataset.c; render(); const n = document.getElementById('answer'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); },
  place: el => { S.placed.push(+el.dataset.i); speak(S.list[S.i].bank[+el.dataset.i]); render(); },
  unplace: el => { S.placed.splice(+el.dataset.pos, 1); render(); },
  match: el => {
    const ex = S.list[S.i], i = +el.dataset.i;
    if (el.dataset.side === 'l') { S.m.left = i; S.m.bad = null; speak(ex.pairs[i][0]); render(); return; }
    if (S.m.left === null) { toast('Bitte zuerst links ein Wort antippen.'); return; }
    if (S.m.left === i) { S.m.done.push(i); S.m.left = null; S.m.bad = null; ding(true); }
    else { S.m.miss = true; S.m.bad = { l: S.m.left, r: i }; S.m.left = null; ding(false); }
    if (S.m.done.length === ex.pairs.length) settle(!S.m.miss, { correct: S.m.miss ? ex.pairs.map(p => p.join(' = ')).join(', ') : '' });
    else render();
  },
  spoke: () => settle(true, { note: 'Lautes Sprechen ist die beste Übung.' }),
  mic: () => {
    if (!SR || S.listening) return;
    const ex = S.list[S.i];
    try {
      window.speechSynthesis?.cancel?.();
      rec = new SR(); rec.lang = 'it-IT'; rec.interimResults = false; rec.maxAlternatives = 3;
      rec.onresult = e => {
        const alts = Array.from(e.results[0]).map(a => a.transcript);
        const best = alts.map(t => [similar(t, ex.it), t]).sort((a, b) => b[0] - a[0])[0];
        S.heard = best[1]; S.listening = false;
        if (best[0] >= 0.72) settle(true, { note: `Sehr gut ausgesprochen! Verstanden: „${best[1]}“` }); else { render(); toast('Noch nicht ganz. Hören Sie noch einmal zu und versuchen Sie es erneut.'); }
      };
      rec.onerror = () => { S.listening = false; render(); toast('Das Mikrofon konnte nicht verwendet werden. Sprechen Sie einfach laut nach und tippen Sie auf den Knopf unten.', 5000); };
      rec.onend = () => { if (S && S.listening) { S.listening = false; render(); } };
      S.listening = true; rec.start(); render();
    } catch (e) { S.listening = false; toast('Das Mikrofon steht hier nicht zur Verfügung.'); }
  },
  why: async el => {
    el.disabled = true; el.textContent = '💡 Einen Moment …';
    const fb = S.fb;
    try { fb.ai = await explainMistake(fb.task, fb.given || '(keine Antwort)', fb.correct); if (S && S.fb === fb) render(); }
    catch (e) { toast(e.message); el.disabled = false; el.textContent = '💡 Warum?'; }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el, e);
});

document.addEventListener('input', e => {
  const k = e.target.dataset?.in;
  if (k === 'text' && S) {
    S.text = e.target.value;
    const b = document.querySelector('[data-act="check"]'); if (b) b.disabled = !S.text.trim();
    const g = document.querySelector('.gap'); if (g) g.textContent = S.text || ' ';
  }
  if (k === 'apiKey' || k === 'proxyUrl') {
    state.settings[k] = e.target.value.trim(); save();
    const s = document.querySelector('.status'); if (s) { s.className = 'status ' + (aiReady() ? 'ok' : ''); s.textContent = aiStatus(); }
  }
});

document.addEventListener('change', async e => {
  const k = e.target.dataset?.in;
  if (k === 'photos') { const files = [...e.target.files]; e.target.value = ''; await addPhotos(files); }
  if (k === 'model') { state.settings.model = e.target.value; save(); }
  if (k === 'import') {
    try {
      const obj = JSON.parse(await e.target.files[0].text());
      if (!Array.isArray(obj.profiles)) throw new Error();
      if (await confirmBox('Die Sicherung ersetzt alle Daten auf diesem Gerät. Fortfahren?', 'Ersetzen')) { replaceState({ ...obj, settings: { ...obj.settings, apiKey: state.settings.apiKey } }); go('profiles'); }
    } catch (err) { toast('Diese Datei ist keine gültige Sicherung.'); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || view.name !== 'session' || !S) return;
  if (S.phase === 'fb') next();
  else { const b = document.querySelector('[data-act="check"]'); if (b && !b.disabled) check(); }
});

function render() {
  const p = profile();
  if (!p && view.name !== 'profiles') view = { name: 'profiles' };
  document.documentElement.style.fontSize = (18 * (p?.prefs.font || 1)) + 'px';
  if (view.name === 'session' && !S) view = { name: 'home' };
  if (view.name === 'memory' && !M) view = { name: 'games' };
  if (view.name === 'summary' && !lastSummary) view = { name: 'home' };
  app.innerHTML = views[view.name](p);
  if (view.name === 'session') autoSpeak();
}

if (!window.claude && 'serviceWorker' in navigator && location.protocol === 'https:' && !document.currentScript) navigator.serviceWorker.register('sw.js').catch(() => {});
initAI(() => { if (!S && view.name !== 'memory') render(); });
navigator.storage?.persist?.().catch?.(() => {});
render();

})();
</script>
</body>
</html>
